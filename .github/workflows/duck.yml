# Redraws the rubber duck contribution graph once a day.
# The SVGs go to the `output` branch only. The bot never touches main.
name: duck

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["duck/**", ".github/workflows/duck.yml"]

permissions:
  contents: write

concurrency:
  group: duck
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the duck
        run: python duck/generate.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "Redraw the duck graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
